name: Automated Streak Keeper

on:
  schedule:
    # Distributed across 8 scheduled intervals per day at odd minutes
    # (01:17, 04:17, 07:17, 10:17, 13:17, 16:17, 19:17, 22:17 UTC)
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Random Timing Jitter
        if: github.event_name == 'schedule'
        run: |
          # Sleep a random duration (between 30s and 900s / 15 minutes) to ensure natural, unpredictable timestamps
          JITTER=$((RANDOM % 870 + 30))
          echo "Applying random timing jitter of ${JITTER} seconds..."
          sleep $JITTER

      - name: Evaluate Streak Decision
        id: manager
        run: |
          python streak_manager.py --event "${{ github.event_name }}"

      - name: Commit and Push Changes
        if: steps.manager.outputs.should_commit == 'true'
        run: |
          git config --global user.name "somraj-dev"
          git config --global user.email "iitainsomraj701@gmail.com"
          
          git add last_run.txt activity_state.json
          git commit -m "${{ steps.manager.outputs.commit_message }}"
          git pull --rebase origin main
          git push origin main
