name: Automated Streak Keeper

on:
  schedule:
    # Runs twice daily at 04:00 UTC (09:30 AM IST) and 16:00 UTC (09:30 PM IST)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Activity Timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat <<EOF > last_run.txt
========================================
🔥 GitHub Streak Keeper Activity Record
========================================
Last Automated Run : $TIMESTAMP
Triggered By       : ${{ github.event_name }}
Workflow Run ID    : ${{ github.run_id }}
Repository         : ${{ github.repository }}
Status             : Active & Synced
========================================
EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "somraj-dev"
          git config --global user.email "iitainsomraj701@gmail.com"
          
          git add last_run.txt
          git commit -m "Automated streak update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin main
