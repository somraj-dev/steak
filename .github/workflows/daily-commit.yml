name: Automated Streak Keeper

on:
  schedule:
    # Runs twice daily at 04:00 UTC (09:30 AM IST) and 16:00 UTC (09:30 PM IST)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  streak-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config --global user.name "somraj-dev"
          git config --global user.email "iitainsomraj701@gmail.com"

      - name: Update Activity and Timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat <<EOF > last_run.txt
========================================
🔥 GitHub Streak Keeper Activity Record
========================================
Last Automated Run : $TIMESTAMP
Triggered By       : ${{ github.event_name }}
Workflow Run ID    : ${{ github.run_id }}
Repository         : ${{ github.repository }}
Status             : Active & Synced
========================================
EOF

      - name: Commit and Push Changes
        run: |
          git add last_run.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated streak update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
