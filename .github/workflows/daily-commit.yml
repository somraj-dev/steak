name: Automated Streak Keeper

on:
  schedule:
    # Runs twice daily at 04:00 UTC (09:30 AM IST) and 16:00 UTC (09:30 PM IST)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update Activity and Commit
        run: |
          git config --global user.name "somraj-dev"
          git config --global user.email "iitainsomraj701@gmail.com"
          
          echo "========================================" > last_run.txt
          echo "🔥 GitHub Streak Keeper Activity Record" >> last_run.txt
          echo "========================================" >> last_run.txt
          echo "Last Automated Run : $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> last_run.txt
          echo "Triggered By       : ${{ github.event_name }}" >> last_run.txt
          echo "Workflow Run ID    : ${{ github.run_id }}" >> last_run.txt
          echo "Repository         : ${{ github.repository }}" >> last_run.txt
          echo "Status             : Active & Synced" >> last_run.txt
          echo "========================================" >> last_run.txt
          
          git add last_run.txt
          git commit -m "Automated streak update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin main
